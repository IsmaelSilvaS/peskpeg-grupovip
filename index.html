<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pesk&peg Fishing — Grupo VIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#07080a;
    --gold-1:#f7d774;
    --gold-2:#c9982f;
    --gold-3:#8a6a1a;
    --ink:#ece7d8;
    --ink-dim:#9a988f;
    --green:#22c35e;
    --green-dark:#0e7a38;
    --line:rgba(201,152,47,0.35);
    --maxw:460px;
    --gap: clamp(4px, 1.1dvh, 12px);
    --gap-lg: clamp(6px, 1.8dvh, 18px);
  }

  *{box-sizing:border-box;}
  html, body{
    height:100%;
    margin:0;
    overflow:hidden;
    overscroll-behavior:none;
  }
  body{
    background:var(--bg-0);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* background photo + vignette, fixed behind everything */
  .bg-photo{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background-image:url("./imgs/background.jfif");
    background-size:cover;
    background-position:58% 78%;
  }
  .bg-overlay{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(55% 30% at 50% 4%, rgba(247,215,116,0.12), transparent 65%),
      linear-gradient(180deg,
        rgba(5,6,7,0.98) 0%,
        rgba(5,6,7,0.94) 14%,
        rgba(6,7,8,0.70) 26%,
        rgba(6,7,8,0.36) 38%,
        rgba(6,7,8,0.26) 50%,
        rgba(6,7,8,0.55) 64%,
        rgba(5,6,7,0.90) 80%,
        rgba(5,6,7,0.98) 100%);
  }
  .bg-noise{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:0.18;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>");
  }

  .page{
    max-width:var(--maxw);
    margin:0 auto;
    position:relative;
    height:100dvh;
    height:100vh; /* fallback */
    padding:
      max(10px, env(safe-area-inset-top, 0px))
      18px
      max(10px, env(safe-area-inset-bottom, 0px));
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    overflow:hidden;
  }

  .content{
    position:relative;
    z-index:1;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  /* logo */
  .brand{
    width:56%;
    max-width:220px;
    margin:0 auto var(--gap);
    flex-shrink:0;
    animation:riseIn 0.7s ease both;
  }
  .brand img{width:100%;display:block;filter:drop-shadow(0 6px 18px rgba(247,215,116,0.18));}

  h1.eyebrow{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:clamp(0.9rem, 3.2dvh, 1.4rem);
    line-height:1.1;
    letter-spacing:0.01em;
    margin:0;
    color:#f4f2ea;
    flex-shrink:0;
    animation:riseIn 0.7s ease 0.05s both;
  }

  h2.headline{
    font-family:'Archivo Black',sans-serif;
    font-weight:400;
    font-size:clamp(1.9rem, 8.2dvh, 3.2rem);
    line-height:0.9;
    margin:0.05em 0 var(--gap);
    letter-spacing:-0.01em;
    background:linear-gradient(180deg, #fdeeb0 0%, var(--gold-1) 35%, var(--gold-2) 70%, var(--gold-3) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 2px 0 rgba(0,0,0,0.4));
    flex-shrink:0;
    animation:riseIn 0.8s ease 0.1s both;
  }

  p.subline{
    font-size:clamp(0.72rem, 2.1dvh, 0.98rem);
    line-height:1.35;
    max-width:300px;
    color:var(--ink);
    margin:0 0 var(--gap-lg);
    flex-shrink:0;
    animation:riseIn 0.8s ease 0.15s both;
  }
  p.subline b{color:var(--gold-1); font-weight:700;}

  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:1px solid var(--gold-2);
    background:linear-gradient(180deg, rgba(247,215,116,0.14), rgba(247,215,116,0.03));
    backdrop-filter:blur(2px);
    border-radius:999px;
    padding:clamp(6px,1.4dvh,11px) clamp(14px,3vw,20px);
    margin-bottom:var(--gap-lg);
    flex-shrink:0;
    box-shadow:0 0 0 1px rgba(247,215,116,0.06), 0 8px 24px rgba(247,215,116,0.08);
    animation:riseIn 0.8s ease 0.2s both;
  }
  .badge svg{width:16px;height:16px;flex-shrink:0;}
  .badge .txt{font-size:clamp(0.75rem, 2dvh, 0.92rem);font-weight:600;color:var(--ink);}
  .badge .pct{
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(0.95rem, 2.6dvh, 1.2rem);
    color:var(--gold-1);
    margin:0 2px;
  }

  /* small window that lets the background photo breathe between the badge and the features */
  .photo-space{
    width:100%;
    flex:0 0 auto;
    height:clamp(28px, 7dvh, 90px);
    animation:riseIn 0.9s ease 0.25s both;
  }

  /* features */
  .features{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    width:100%;
    margin:0 0 var(--gap-lg);
    padding:clamp(6px,1.4dvh,14px) 4px;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    background:rgba(5,6,7,0.35);
    backdrop-filter:blur(3px);
    border-radius:14px;
    flex-shrink:0;
    animation:riseIn 0.9s ease 0.3s both;
  }
  .feature{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .feature .icon{
    width:clamp(26px,5.5dvh,38px);height:clamp(26px,5.5dvh,38px);
    border-radius:50%;
    border:1px solid var(--gold-2);
    display:flex;align-items:center;justify-content:center;
    color:var(--gold-1);
    background:rgba(5,6,7,0.3);
  }
  .feature .icon svg{width:52%;height:52%;}
  .feature span{
    font-size:clamp(0.55rem, 1.5dvh, 0.68rem);
    line-height:1.15;
    color:var(--ink-dim);
    font-weight:600;
  }

  /* CTA */
  .cta{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    max-width:340px;
    padding:clamp(10px,2.2dvh,17px) 20px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    background:linear-gradient(180deg, #2fe073, var(--green) 55%, var(--green-dark));
    color:#06210f;
    font-family:'Inter',sans-serif;
    font-weight:800;
    font-size:clamp(0.8rem, 2.2dvh, 1rem);
    letter-spacing:0.01em;
    text-decoration:none;
    flex-shrink:0;
    box-shadow:0 0 0 1px rgba(34,195,94,0.25), 0 14px 34px rgba(34,195,94,0.35), inset 0 1px 0 rgba(255,255,255,0.35);
    animation:riseIn 0.9s ease 0.35s both, pulse 2.6s ease-in-out 1.4s infinite;
    -webkit-tap-highlight-color:transparent;
  }
  .cta:active{transform:scale(0.97);}
  .cta svg{width:19px;height:19px;flex-shrink:0;}
  .cta .arrow{transition:transform 0.2s ease;}
  .cta:hover .arrow{transform:translateX(4px);}

  .trust{
    display:flex;
    align-items:center;
    gap:12px;
    margin:var(--gap) 0 0;
    font-size:clamp(0.6rem, 1.6dvh, 0.76rem);
    color:var(--ink-dim);
    flex-shrink:0;
    animation:riseIn 0.9s ease 0.4s both;
  }
  .trust .item{display:flex;align-items:center;gap:5px;}
  .trust svg{width:12px;height:12px;color:var(--gold-2);}
  .trust .div{width:1px;height:12px;background:var(--line);}

  footer{
    margin-top:var(--gap);
    padding-top:var(--gap);
    border-top:1px solid var(--line);
    width:100%;
    font-size:clamp(0.55rem, 1.4dvh, 0.68rem);
    letter-spacing:0.2em;
    color:#5f5d55;
    flex-shrink:0;
    animation:riseIn 0.9s ease 0.45s both;
  }

  @keyframes riseIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 1px rgba(34,195,94,0.25), 0 14px 34px rgba(34,195,94,0.35), inset 0 1px 0 rgba(255,255,255,0.35);}
    50%{box-shadow:0 0 0 1px rgba(34,195,94,0.35), 0 14px 46px rgba(34,195,94,0.55), inset 0 1px 0 rgba(255,255,255,0.35);}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;}
  }

  @media (min-width:520px){
    .page{padding-top:max(20px, env(safe-area-inset-top,0px));}
  }
</style>
</head>
<body>

<div class="bg-photo"></div>
<div class="bg-overlay"></div>
<div class="bg-noise"></div>

<div class="page">
  <div class="content">

    <div class="brand">
      <img src="./imgs/logo.png" alt="Pesk&peg Fishing">
    </div>

    <h1 class="eyebrow">ENTRE NO NOSSO</h1>
    <h2 class="headline">GRUPO VIP</h2>
    <p class="subline">E receba <b>promoções exclusivas</b> de materiais de pesca</p>

    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 3 6v6c0 5 4 8.5 9 10 5-1.5 9-5 9-10V6l-9-4Z"/><path d="M8.5 12.5l2.5 2.5 5-5"/></svg>
      <span class="txt">Até <span class="pct">40%</span> de desconto</span>
    </div>

    <div class="photo-space"></div>

    <div class="features">
      <div class="feature">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="3"/><circle cx="17" cy="17" r="3"/><line x1="5" y1="19" x2="19" y2="5"/></svg></div>
        <span>Promoções<br>exclusivas</span>
      </div>
      <div class="feature">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
            <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
            <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
            <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
          </svg>
        </div>
        <span>Lançamentos<br>em primeira mão</span>
      </div>
      <div class="feature">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12v9H4v-9"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7c-1.5 0-4-1-4-3.2C8 2 9 1.5 10 2c1.4.7 2 3 2 5Z"/><path d="M12 7c1.5 0 4-1 4-3.2 0-1.8-1-2.3-2-1.8-1.4.7-2 3-2 5Z"/></svg></div>
        <span>Sorteios<br>e brindes</span>
      </div>
      <div class="feature">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M2.5 20c0-3.3 3-6 6.5-6s6.5 2.7 6.5 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M15.5 20c.1-2.6 1.9-4.7 4.5-5"/></svg></div>
        <span>Comunidade<br>de pescadores</span>
      </div>
    </div>

    <a class="cta" href="https://wa.me/5500000000000?text=Quero%20entrar%20no%20Grupo%20VIP" target="_blank" rel="noopener" id="ctaBtn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.39 1.26 4.81L2 22l5.42-1.42a9.87 9.87 0 0 0 4.62 1.15h.01c5.46 0 9.9-4.45 9.9-9.91C21.95 6.45 17.5 2 12.04 2Zm5.8 14.02c-.24.68-1.38 1.3-1.9 1.38-.5.08-1.13.11-1.83-.12-.42-.13-.96-.31-1.66-.6-2.92-1.26-4.83-4.2-4.98-4.4-.14-.19-1.2-1.6-1.2-3.05 0-1.45.76-2.16 1.03-2.46.27-.3.59-.37.79-.37.2 0 .4 0 .57.01.18.01.43-.07.67.51.24.6.83 2.06.9 2.21.07.15.12.33.02.53-.1.2-.15.32-.3.49-.15.17-.31.38-.44.51-.15.15-.3.31-.13.6.17.3.76 1.26 1.64 2.04 1.13 1 2.08 1.32 2.38 1.47.3.15.47.13.65-.07.18-.2.76-.88.96-1.19.2-.3.4-.25.66-.15.27.1 1.72.81 2.01.96.3.15.5.22.57.35.07.13.07.75-.17 1.43Z"/></svg>
      <span>ENTRAR NO GRUPO VIP</span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>

    <div class="trust">
      <div class="item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        100% seguro
      </div>
      <div class="div"></div>
      <div class="item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M2.5 20c0-3.3 3-6 6.5-6s6.5 2.7 6.5 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M15.5 20c.1-2.6 1.9-4.7 4.5-5"/></svg>
        Vagas limitadas
      </div>
    </div>

    <footer>PESQUE PAY FISHING</footer>
  </div>
</div>

<script>
  document.getElementById('ctaBtn').addEventListener('click', function(){
    console.log('Grupo VIP CTA clicked');
  });

  // Extra safety net: if content is ever taller than the viewport
  // (very unusual aspect ratios), gently scale the whole content block
  // down instead of allowing a scrollbar to appear.
  function fitToScreen(){
    var content = document.querySelector('.content');
    var page = document.querySelector('.page');
    content.style.transform = 'scale(1)';
    var contentH = content.scrollHeight;
    var pageH = page.clientHeight;
    if(contentH > pageH){
      var scale = Math.max(0.72, pageH / contentH);
      content.style.transform = 'scale(' + scale + ')';
      content.style.transformOrigin = 'top center';
    }
  }
  window.addEventListener('load', fitToScreen);
  window.addEventListener('resize', fitToScreen);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitToScreen);
  }
</script>

</body>
</html>
